name: Protected Release

# workflow_run executes this workflow from the default branch, not from the
# selected ref of the unprivileged manual request workflow.
on:
  workflow_run:
    workflows: ["Release Request"]
    types: [completed]

jobs:
  release:
    if: github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    name: Create release for new version
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check for unreleased version
        id: check
        shell: bash
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          TAG="v${CURRENT_VERSION}"

          if ! printf '%s' "$CURRENT_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Repository version is not a stable semver; refusing release." >&2
            exit 1
          fi

          if git tag -l "$TAG" | grep -qx "$TAG"; then
            echo "Tag $TAG already exists; skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Explicit manual release requested for ${CURRENT_VERSION}."
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.check.outputs.released == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.check.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          PREV_TAG=$(git tag --sort=-version:refname | head -1)
          NOTES="Released ${TAG}."
          if [ -n "$PREV_TAG" ]; then
            printf -v NOTES '%s\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s' \
              "$NOTES" "${{ github.repository }}" "$PREV_TAG" "$TAG"
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes "$NOTES"

      - name: Trigger publish workflow
        if: steps.check.outputs.released == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.check.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --ref "$RELEASE_TAG" -f ref="$RELEASE_TAG"
